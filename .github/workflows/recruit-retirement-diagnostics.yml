  coverage-current:
    name: Coverage (current)
    needs: lint
    if: ${{ needs.lint.outputs.changelog_only != 'true' && needs.lint.outputs.docs_only != 'true' && needs.lint.outputs.admitted_merge != 'true' && needs.lint.outputs.full_suite != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: d75f3b7828734709e4bebb0c7192454c12239026

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve authoritative coverage base
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: 2cc4ae522bcdceaea13ef4277265e5d5f96b9ba1
        run: |
          set -eu
          base_ref="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="$(git merge-base "$PR_HEAD_SHA" "$PR_BASE_SHA")"
          fi
          if [ -z "$base_ref" ] || [ "$base_ref" = "0000000000000000000000000000000000000000" ]; then
            base_ref="$(git rev-parse HEAD^)"
          fi
          git rev-parse --verify "${base_ref}^{commit}" >/dev/null
          echo "COVERAGE_BASE_REF=$base_ref" >> "$GITHUB_ENV"
          echo "COVERAGE_HEAD_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: make build

      - name: Run scoped unit tests with coverage
        shell: bash
        env:
          DWS_PACKAGE_VERSION: 0.0.0-test
        run: |
          set -euo pipefail
          changed_output="$(
            ./scripts/ci/changed-test-packages.sh \
              changed "$COVERAGE_BASE_REF" "$COVERAGE_HEAD_REF"
          )"
          impacted_output="$(
            # Smoke has no production statements and launches a subprocess;
            # the always-on non-full-suite focused smoke shard owns it, while
            # -cover only adds runtime stderr noise.
            ./scripts/ci/changed-test-packages.sh \
              list "$COVERAGE_BASE_REF" "$COVERAGE_HEAD_REF" |
              awk '$0 != "github.com/DingTalk-Real-AI/dingtalk-workspace-cli/test/smoke"'
          )"
          if [ -z "$changed_output" ] || [ -z "$impacted_output" ]; then
            printf 'mode: atomic\n' > coverage.txt
            echo "No buildable Go package needs scoped coverage." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            mapfile -t changed_packages <<< "$changed_output"
            mapfile -t impacted_packages <<< "$impacted_output"
            coverpkg="$(IFS=,; echo "${changed_packages[*]}")"
            go test -count=1 -p 1 \
              -coverpkg="$coverpkg" \
              -coverprofile=coverage.txt \
              -covermode=atomic \
              "${impacted_packages[@]}"
          fi
          if [ "$(wc -l < coverage.txt)" -gt 1 ]; then
            go tool cover -func=coverage.txt
          fi

      - name: Upload current coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: coverage-current-profile
          path: coverage.txt
          retention-days: 1

